          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: { type: string, maxLength: 640 }
                limit: { type: integer, minimum: 1, maximum: 25, default: 25 }
                cursor: { type: string }
      responses:
        "200": { description: Mutation counts and optional continuation cursor. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /xrpc/link.latr.bookmarks.setState:
    post:
      operationId: setLatrBookmarkState
      summary: Archive or unarchive bookmark metadata
      tags: [Latr]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookmarkUri, state]
              properties:
                bookmarkUri: { type: string }
                state:
                  type: string
                  enum: [archived, unread]
      responses:
        "200": { description: State updated. }
        "401": { $ref: "#/components/responses/Unauthorized" }

    patch:
      operationId: setLatrBookmarkStatePatchCompatibility
      summary: Archive or unarchive through the deployed upstream PATCH compatibility route
      description: >-
        The canonical Lexicon remains a POST procedure. The deployed L@tr bookmark
        state handler accepts PATCH, so Social Wire clients select PATCH before
        signing both gateway DPoP proofs. This protected alias forwards PATCH
        unchanged; existing POST requests retain their signed method and are not
        rewritten. Existing native clients require an updated app build.
      tags: [Latr]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookmarkUri, state]
              properties:
                bookmarkUri: { type: string }
                state:
                  type: string
                  enum: [archived, unread]
      responses:
        "200": { description: State updated. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /xrpc/link.latr.bookmarks.deleteBookmark:
    post:
      operationId: deleteLatrBookmark
      summary: Delete a bookmark and matching L@tr metadata
