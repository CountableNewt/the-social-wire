        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: Semble public projection failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/semble/collection:
    get:
      operationId: getSembleCollection
      summary: Get a viewer-owned Semble collection with rich cards and proven record links
      description: |
