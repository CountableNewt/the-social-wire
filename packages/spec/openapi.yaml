  # ── Publication sidebar projection ────────────────────────────────────────

  /v1/publications/sidebar:
    get:
      operationId: getPublicationSidebar
      summary: Unified subscribed/following publication sidebar projection
      description: |
        Merges follow-graph discovery, graph subscriptions, Skyreader RSS rows,
        orphan subscription hydration, folder prefs, and per-publication AppView scope keys.

        Use `phase=priority` for folders plus unfoldered/following publications (fast first paint),
        then `phase=folderPublications` for folder contents (reuses a short-lived server discovery cache),
        and fetch unread badges separately via `/v1/appview/unread-counts`.
      tags: [Publications]
      parameters:
        - name: phase
          in: query
          required: false
          schema:
            type: string
            enum: [full, priority, folderPublications]
          description: |
            `priority` returns folder shells and top-level publications without folder contents.
            `folderPublications` returns folder section publications (after a recent `priority` call).
            Default `full` returns the complete sidebar in one response.
      responses:
        "200":
          description: Sidebar projection for the authenticated viewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationSidebarResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/publications/refresh:
    post:
      operationId: refreshPublicationSidebar
      summary: Drop cached sidebar projection and rebuild the priority tier
      description: >-
        Invalidates the viewer's server-side projection caches and returns the rebuilt priority
        tier. Full follow-graph discovery runs in the background after the response is sent, so
        `folderSections` come back without their `publications` and `followingTabPublications` may
        be a carried-over snapshot. Clients must merge this payload into an existing projection
        rather than replacing one, and should follow it with a bootstrap stream to populate the
        folder tier.
      tags: [Publications]
      responses:
        "200":
          description: Rebuilt priority-tier sidebar projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationSidebarResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/publications/resolve:
    post:
      operationId: resolveAddPublication
      summary: Resolve a link into a standard.site publication or RSS feed target
      tags: [Publications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
      responses:
        "200":
          description: Resolver outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveAddPublicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Thin AppView (data-minimized read index) ──────────────────────────────

  /v1/appview/bootstrap-stream:
    get:
      operationId: getAppViewBootstrapStream
      summary: Progressive NDJSON bootstrap for initial reader load
      description: |

        Streams newline-delimited JSON events as sidebar projection, per-section sidebar
        slices, unread counts, first-unread publication selection, first feed page, and
        legacy folder rows complete.
        Gateway forwards the AppView body without buffering when proxied.

        Event kinds (one JSON object per line): `sidebarPriority`, `sidebarSection`,
        `unreadCounts`, `selectedPublication`, `entriesPage`, `sidebarFolders`, `warning`,
        `error`, `done`. New clients should prefer `sidebarSection` over monolithic
        `sidebarFolders` during the migration.

        `sidebarSection` payload:
        `{ sectionKey, folderRkey?, folderUri?, publications, unreadCounts?, replacePublicationIds?, refreshedAt, sectionGeneration? }`.

        `unreadCounts` payload:
        `{ counts, replacePublicationIds?, generation?, accuracy?, countedAt? }`. Clients should apply
        newer generations only; `exact` counts may replace same-generation `estimated` counts.

        `entriesPage` payload:
        `{ publicationId, entries, cursor?, source, cachedAt?, expiresAt? }`, where `source` is
        `live_projection`, `projection_cache`, or `unavailable`. Cached pages always retain the
        original `cachedAt` and `expiresAt`; clients must reject cached payloads without both.
        Entry objects retain optional publisher `contentLabels` for visual indicators.
        The `done.source` value is the least-current source emitted by the stream, so a cached or
        unavailable entries page cannot be reported as a wholly live bootstrap.
      tags: [AppView]
      parameters:
        - in: query
          name: includeLists
          schema: { type: boolean, default: false }
          description: Opt in to a lists event containing own and saved public Standard Reader records before done. Omitted for older clients.
      responses:
        "200":
          description: NDJSON event stream.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited `BootstrapStreamEvent` JSON objects.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-cache`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Route disabled when thin AppView flag is unset.

  /xrpc/app.thesocialwire.appview.refreshFeed:
    post:
      operationId: refreshAppViewFeed
      summary: Stream an explicit refresh of one viewer feed
      description: |
        Checks every publication in the viewer's Subscribed, Following, folder, publication, or
        list feed for new articles with bounded concurrency (Microcosm discovery for
        standard.site authors, Skyreader polls for RSS feeds). Gateway forwards the AppView body
        without buffering.

        Event kinds (one JSON object per line, keyed by `kind`):
        `started` `{ total }`, then one `publication`
        `{ publicationId, status, indexed, completed, total }` per source as it finishes, where
        `status` is `updated`, `checked`, or `unavailable`, then `done` `{ total, indexed, unavailable }`.
        Unread counters are reconciled and cached first pages invalidated before `done`, so clients
        should refetch page 1 after `publication` events with `indexed > 0` and refresh unread counts
        after `done`.
      tags: [AppView]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [subscribed, following, publication, folder, list]
                id:
                  type: string
                  maxLength: 2048
                  description: Required for `publication`, `folder`, and `list`.
      responses:
        "200":
          description: NDJSON event stream.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited feed refresh event JSON objects.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-cache`.
        "400":
          description: InvalidRequest — unknown `kind` or missing `id`.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/appview/feed:
    get:
      operationId: listAggregateAppViewFeed
      summary: Paginated viewer-scoped aggregate feed
      description: |
        Validates publication membership against the authenticated viewer's materialized
        feed projection and executes one globally ordered indexed content query. It never
        performs PDS discovery, publication resolution, RSS fetch, or enrollment.
      tags: [AppView]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [subscribed, following, folder, publication, list]
        - name: id
          in: query
          schema:
            type: string
          description: Required folder rkey/URI or publication ID for matching feed kinds.
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Globally ordered aggregate entry page.
          headers:
            X-AppView-Feed-Source:
              schema: { type: string, enum: [materialized_projection] }
            X-AppView-Membership-Updated-At:
              schema: { type: string, format: date-time }
            Server-Timing:
              description: Database and total AppView feed duration (`db;dur`, `appview_feed;dur`).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntryListItem"
                  cursor:
                    type: string
                    nullable: true
        "400":
          description: Invalid feed kind or missing required identifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Feed is not available to the authenticated viewer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }
        "503":
          description: Transient database failure or `feed_projection_warming` when no materialization/cache exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }
        "504":
          description: Feed request deadline exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }


















  /v1/analytics/bluesky:
    get:
      operationId: getBlueskyAnalytics
      summary: Read Viewer-Owned Bluesky Account And Article Sharing Analysis
      tags: [Analytics]
      security: [{ATProtoOAuthDPoP: []}]
      description: Reads current profile counts and a bounded author-feed sample from the Bluesky AppView. Ranks posts published during the selected period by current cumulative engagement, not engagement gained during that period. Searches up to five cached viewer-owned article URLs for recently published shares. Search is incomplete by definition; no network totals, impressions, reach, clicks, follower history, or background collection are inferred. Partial provider failures are represented with nullable metrics and availability flags. Refresh Creator Analytics first to populate article URL inventory.
      parameters:
        - {in: query, name: days, schema: {type: integer, enum: [7, 30, 90], default: 30}}
      responses:
        '200': {description: Bounded Bluesky Analysis With Explicit Coverage, content: {application/json: {schema: {$ref: '#/components/schemas/BlueskyAnalyticsSummary'}}}}
        '400': {description: Invalid Period}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Request Limit Reached}
        '503': {description: Analytics Unavailable}
  /v1/analytics/publications:
    get:
      operationId: getPublicationAnalytics
      summary: Read Viewer-Owned Standard.site Publication Analytics
      tags: [Analytics]
      security: [{ATProtoOAuthDPoP: []}]
      description: Reads viewer-owned Standard.site publications and a bounded public document inventory. Counts distinct public subscribers per publication and sums distinct public recommenders per document. Counts are current observations from the public backlink index and are independent of the Bluesky date range.
      responses:
        '200': {description: Publication Analytics With Explicit Coverage, content: {application/json: {schema: {$ref: '#/components/schemas/PublicationAnalyticsSummary'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Request Limit Reached}
        '502': {description: Publication Analytics Provider Unavailable}
        '503': {description: Analytics Unavailable}
  /v1/analytics/summary:
    get:
      operationId: getCreatorAnalytics
      summary: Read Viewer-Owned Creator Analytics
      tags: [Analytics]
      security: [{ATProtoOAuthDPoP: []}]
      description: Current known platform engagement and separately scoped Social Wire traffic. No historical platform impressions or external blog traffic are inferred. Daily snapshots begin on refresh. Views and clicks from the author are excluded.
      parameters: &creatorAnalyticsParameters
        - {in: query, name: days, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: cursor, schema: {type: string}, description: Viewer-owned canonical subject URI.}
      responses:
        '200': {description: Account-Scoped Analytics, content: {application/json: {schema: {$ref: '#/components/schemas/CreatorAnalyticsSummary'}}}}
        '400': {description: Invalid Range Or Cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Request Limit Reached}
        '503': {description: Analytics Storage Unavailable}
  /v1/analytics/refresh:
    post:
      operationId: refreshCreatorAnalytics
      summary: Refresh Platform Inventory And Engagement Snapshot
      tags: [Analytics]
      security: [{ATProtoOAuthDPoP: []}]
      description: Refreshes bounded public PDS inventory and AppView counters for the authenticated author. Coverage identifies partial inventory; cumulative snapshots never imply historic daily interactions. Limited to one refresh per minute per viewer.
      parameters: *creatorAnalyticsParameters
      responses:
        '200': {description: Refreshed Analytics, content: {application/json: {schema: {$ref: '#/components/schemas/CreatorAnalyticsSummary'}}}}
        '400': {description: Invalid Range Or Cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Refresh Limit Reached}
        '502': {description: Platform Data Unavailable}
        '503': {description: Analytics Storage Unavailable}
  /v1/analytics/events:
    post:
      operationId: recordCreatorAnalyticsEvent
      summary: Record A Bounded Social Wire Observation
      tags: [Analytics]
      security: [{ATProtoOAuthDPoP: []}]
      description: Authenticated observations are deduplicated by subject, event, and daily viewer pseudonym. No raw viewer DID, IP, user agent, destination URL, or message text is stored. Author traffic is excluded; canonical ownership is verified. Pseudonyms expire after 30 days and snapshots/aggregates after 90 days. CTR uses the same scoped denominator and is null without impressions. Cross-origin iframe clicks and external platform traffic are not observed.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatorAnalyticsEvent'}}}
      responses:
        '202': {description: Observation Accepted Or Already Recorded}
        '400': {description: Invalid Observation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Canonical Public Content Unavailable}
        '429': {description: Observation Limit Reached}
        '503': {description: Analytics Storage Unavailable}

  /v1/telemetry/client-performance:
    post:
      operationId: recordClientPerformance
      summary: Record bounded reader performance or tab usage telemetry
      description: |
        Accepts allowlisted aggregate measurements only. DIDs, publication IDs, URLs,
        entry IDs, titles, and arbitrary dimensions are not accepted. Tab usage stores only a
        secret-derived pseudonym with the UTC day and allowlisted tab, retained for 30 days.
      tags: [Telemetry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [event, durationMs, feedType, cacheState, outcome, environment]
                  properties:
                    event: { type: string, enum: [cached_feed_paint, uncached_feed_paint, feed_switch, fresh_merge, feed_error] }
                    durationMs: { type: number, minimum: 0, maximum: 60000 }
                    feedType: { type: string, enum: [aggregate, publication] }
                    cacheState: { type: string, enum: [hit, miss] }
                    outcome: { type: string, enum: [success, error] }
                    environment: { type: string, enum: [local, dev, test, production] }
                - type: object
                  additionalProperties: false
                  required: [event, tab, durationMs, environment]
                  properties:
                    event: { type: string, enum: [tab_open, tab_dwell] }
                    tab: { type: string, enum: [home, explore, notifications, messages, bookmarks, lists, feeds, saved, archive, wire, circle, finance, sports, subscribed, following, podcasts, articles, live-post, livestream, brand-accounts, analytics, profile, content-calendar] }
                    durationMs:
                      type: number
                      minimum: 0
                      maximum: 60000
                      description: Exactly zero for tab_open; greater than zero for tab_dwell.
                    environment: { type: string, enum: [local, dev, test, production] }
      responses:
        "202":
          description: Sample accepted into the bounded telemetry buffer.
        "400":
          description: Invalid or non-allowlisted sample.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/appview/entries:
    get:
      operationId: listAppViewEntries
      summary: Paginated entry timeline from the thin AppView index
      description: |

        Returns Level-1 list rows (title, publishedAt, summary, thumbnail refs) for
        `standard.site` entry collections. Full entry bodies remain on the author PDS.
        Unread filtering joins the viewer's mirrored `read_marks` replica.
      tags: [AppView]
      parameters:
        - name: authorDid
          in: query
          required: true
          schema:
            type: string
          description: Author repo DID whose entries to list.
        - name: publicationAtUri
          in: query
          schema:
            type: string
          description: Optional publication AT-URI for `site` field scoping.
        - name: publicationScopeAtUris
          in: query
          schema:
            type: string
          description: Comma-separated sibling publication AT-URIs for scoped listing.
        - name: publicationSiteUrls
          in: query
          schema:
            type: string
          description: Comma-separated HTTPS site URL keys for scoped listing.
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Page size for a single response, or the internal page size when `maxEntries` is set.
        - name: maxEntries
          in: query
          schema:
            type: integer
            maximum: 500
          description: |
            When set, AppView aggregates multiple timeline pages server-side and returns up to
            this many entries in one response. The client `cursor` is ignored. The response
            `cursor` is present only when more entries remain beyond `maxEntries`.
      responses:
        "200":
          description: Entry list page.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntryListItem"
                  cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: Invalid cursor, filter, limit, or maxEntries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }
        "404":
          description: Route disabled when thin AppView flag is unset.
        "503":
          description: Transient database or dependency failure after one bounded server retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }
        "504":
          description: Feed request deadline exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppViewFeedError" }

  /v1/appview/read-marks:
    post:
      operationId: upsertAppViewReadMark
      summary: Upsert AppView read mark
      tags: [AppView]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectUri]
              properties:
                subjectUri:
                  type: string
                readAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Read mark upserted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Route disabled when thin AppView flag is unset.
    delete:
      operationId: deleteAppViewReadMark
      summary: Delete AppView read mark
      tags: [AppView]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectUri]
