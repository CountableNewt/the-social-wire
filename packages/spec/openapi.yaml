openapi: "3.1.0"
x-tsw-endpoint-manifest: "./endpoint-manifest.json"

info:
  title: The Social Wire API
  description: |
    HTTP contract for the standalone Go backend in **`services/appview`**.
    The public edge verifies OAuth/DPoP, serves client metadata and sync caches,
    projects publication sidebars and reader feeds, streams bootstrap NDJSON,
    and owns private drafts, scheduling and analytics.

    **OAuth client metadata** serves Web and native clients at
    `/oauth-client-metadata.json` and `/ios-client-metadata.json`.

    **Authenticated routes** require OAuth access tokens bound to a usable
    `cnf.jkt` plus an RFC 9449 DPoP proof verified against that exact key.

    **AppView** maintains a data-minimized SQLite projection of PDS records and
    subscribed RSS feeds. User-authored PDS records remain authoritative.

    Native L@tr bookmark XRPC proxy routes are documented here. The web app's same-origin Next.js `/api/latr-gateway` proxy is a separate surface.
  version: "1.0.0"
  contact:
    name: Stygian Tech
    url: https://github.com/Stygian-Tech

servers:
  - url: https://api.thesocialwire.app
    description: Production gateway
  - url: https://api.testing.thesocialwire.app
    description: Development / testing gateway
  - url: http://localhost:8080
    description: Local gateway

# ── Security ──────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    MaintenanceCronBearer:
      type: http
      scheme: bearer
      description: Dedicated CRON_SECRET supplied by Vercel Cron. Distinct from viewer OAuth and JOBS_SECRET.
    MaintenanceJobsBearer:
      type: http
      scheme: bearer
      description: Dedicated JOBS_SECRET for maintenance triggers. Viewer OAuth and DPoP credentials do not authorize these endpoints. Missing configuration disables HTTP job execution.
    ATProtoOAuthDPoP:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ATProto access JWT (`Authorization: Bearer` or `Authorization: DPoP` prefix extracting the JWT).
        The gateway resolves issuer metadata to JWKS before trusting `sub`.

        **`DPoP` header**: supply `DPoP: <jwt proof>` whose **`ath`** claim covers the ASCII access JWT and whose **`cnf`** hash matches **`cnf.jkt`** whenever the issuer embeds confirmation.

        **Hosted infra (first-party only):** when `OAUTH_GATEWAY_REQUIRE_KNOWN_CLIENT` is enabled server-side,
        callers must present JWT claims compatible with **`OAUTH_GATEWAY_ALLOWED_CLIENT_IDS`**
        (typically **`client_id`** / **`azp`**) **and/or** **`OAUTH_GATEWAY_ALLOWED_AUDIENCES`**.
        Operators who **self-host** this gateway configure their own allowlists; arbitrary third-party OAuth
        apps should not rely on Social Wire production API hosts without an explicit arrangement.

  schemas:
    MaintenanceJobResult:
      type: object
      additionalProperties: false
      required: [job, claimed, completed]
      properties:
        job: {type: string, enum: [scheduling, drafts-cleanup, discovery, ttl-cleanup, rss-poll, analytics-cleanup, author-history, read-state-recovery]}
        claimed: {type: boolean, description: False when another instance holds this job's lease.}
        completed: {type: boolean, description: True only after this invocation's bounded action finishes.}
    ArticleDraftLocalAsset: {"type": "object", "required": ["id", "alt", "width", "height", "mimeType", "name"], "properties": {"id": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "alt": {"type": "string"}, "width": {"type": "integer", "minimum": 1, "maximum": 100000}, "height": {"type": "integer", "minimum": 1, "maximum": 100000}, "mimeType": {"type": "string", "enum": ["image/jpeg", "image/png", "image/gif", "image/webp"]}, "name": {"type": "string", "minLength": 1, "maxLength": 1024}}, "description": "Original image metadata. Byte length is bounded to 1000000 by the service, with a ready owner-private photo binding required for every asset.", "additionalProperties": false}
    ArticleDraftPayload: {"type": "object", "required": ["id", "title", "markdown", "excerpt", "path", "tags", "publicationUri", "createdAt", "updatedAt", "assets"], "properties": {"id": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "title": {"type": "string"}, "markdown": {"type": "string"}, "excerpt": {"type": "string"}, "path": {"type": "string"}, "tags": {"type": "array", "items": {"type": "string", "maxLength": 256}, "maxItems": 100}, "publicationUri": {"type": "string"}, "createdAt": {"type": "string", "format": "date-time"}, "updatedAt": {"type": "string", "format": "date-time"}, "assets": {"type": "array", "items": {"$ref": "#/components/schemas/ArticleDraftLocalAsset"}, "maxItems": 200}, "coverAssetId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "publishedUri": {"type": "string", "minLength": 1, "maxLength": 4096}, "scheduleRecordKey": {"type": "string", "minLength": 1, "maxLength": 4096}, "scheduleUri": {"type": "string", "minLength": 1, "maxLength": 4096}, "publishingRecordKey": {"type": "string", "minLength": 1, "maxLength": 4096}, "publicationClaimId": {"type": "string", "format": "uuid", "minLength": 36, "maxLength": 36, "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", "description": "Private client publication/scheduling claim identity; never copied to a PDS record."}}, "description": "Private article content, at most 524288 UTF-8 JSON bytes in total; title/body/excerpt/path/publication identifiers reject NUL. String limits are enforced in UTF-8 bytes by the service. No local cache or sync revisions are included. Publication/scheduling fields only describe explicit user actions, never cause them.", "additionalProperties": false, "dependentRequired": {"publishingRecordKey": ["publicationClaimId"]}}
    ArticleDraftAttachmentRef: {"type": "object", "required": ["localAssetId", "assetId"], "properties": {"localAssetId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "assetId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}}, "additionalProperties": false}
    ArticleDraftAttachmentBinding: {"type": "object", "required": ["localAssetId", "asset"], "properties": {"localAssetId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "asset": {"$ref": "#/components/schemas/SocialDraftAsset"}}, "additionalProperties": false, "description": "Ready owner-private photo only; asset kind photo, at most 1000000 bytes, with name and MIME matching the local asset descriptor."}
    ArticleDraftDocument: {"type": "object", "required": ["draftId", "revision", "deleted", "mutationId", "updatedAt", "attachments"], "properties": {"draftId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "revision": {"type": "integer", "minimum": 1}, "deleted": {"type": "boolean"}, "mutationId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "updatedAt": {"type": "string", "format": "date-time"}, "draft": {"$ref": "#/components/schemas/ArticleDraftPayload"}, "attachments": {"type": "array", "items": {"$ref": "#/components/schemas/ArticleDraftAttachmentBinding"}, "maxItems": 200}}, "description": "Owner-private snapshot. Live results contain draft with matching id; deletion tombstones omit draft and contain no attachments. Tombstones cannot be overwritten to resurrect a draft.", "additionalProperties": false, "allOf": [{"if": {"properties": {"deleted": {"const": false}}}, "then": {"required": ["draft"]}}, {"if": {"properties": {"deleted": {"const": true}}}, "then": {"not": {"required": ["draft"]}, "properties": {"attachments": {"maxItems": 0}}}}]}
    ArticleDraftPutInput: {"type": "object", "required": ["expectedRevision", "mutationId", "draft", "attachments"], "properties": {"expectedRevision": {"type": "integer", "minimum": 0}, "mutationId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "draft": {"$ref": "#/components/schemas/ArticleDraftPayload"}, "attachments": {"type": "array", "items": {"$ref": "#/components/schemas/ArticleDraftAttachmentRef"}, "maxItems": 200}}, "additionalProperties": false}
    ArticleDraftDeleteInput: {"type": "object", "required": ["draftId", "expectedRevision", "mutationId"], "properties": {"draftId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}, "expectedRevision": {"type": "integer", "minimum": 0}, "mutationId": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}}, "additionalProperties": false}
    ArticleDraftListResult: {"type": "object", "additionalProperties": false, "required": ["drafts"], "properties": {"drafts": {"type": "array", "maxItems": 20, "items": {"$ref": "#/components/schemas/ArticleDraftDocument"}}, "cursor": {"type": "string", "minLength": 36, "maxLength": 36, "description": "Canonical lowercase UUID. This private identifier is not a PDS record.", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}}}
    SocialDraftAsset:
      type: "object"
      required: ["assetId", "name", "contentType", "byteLength", "sha256", "kind", "state"]
      properties:
        assetId:
          type: "string"
          minLength: 36
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        name:
          type: "string"
          minLength: 1
          maxLength: 1024
        contentType:
          type: "string"
          minLength: 1
          maxLength: 256
        byteLength:
          type: "integer"
          minimum: 1
          maximum: 104857600
        sha256:
          type: "string"
          minLength: 64
          maxLength: 64
        kind:
          type: "string"
          minLength: 1
          maxLength: 64
          enum: ["photo", "poster", "gif", "video", "caption"]
        state:
          type: "string"
          minLength: 1
          maxLength: 64
          enum: ["reserved", "ready"]
      additionalProperties: false
    SocialDraftManifestRef:
      type: "object"
      required: ["assetId", "role", "ref"]
      properties:
        assetId:
          type: "string"
          minLength: 36
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        role:
          type: "string"
          minLength: 1
          maxLength: 64
          enum: ["original", "prepared", "video", "poster", "caption", "gif"]
        ref:
          type: "string"
          minLength: 0
          maxLength: 512
      additionalProperties: false
    SocialDraftAssetBinding:
      type: "object"
      required: ["assetId", "role", "ref", "asset"]
      properties:
        assetId:
          type: "string"
          minLength: 36
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        role:
          type: "string"
          minLength: 1
          maxLength: 64
          enum: ["original", "prepared", "video", "poster", "caption", "gif"]
        ref:
          type: "string"
          minLength: 0
          maxLength: 512
        asset:
          "$ref": "#/components/schemas/SocialDraftAsset"
      additionalProperties: false
    SocialDraftManifest:
      type: "object"
      required: ["draftId", "revision", "deleted", "attachments"]
      properties:
        draftId:
          type: "string"
          minLength: 13
          maxLength: 13
          pattern: "^[234567abcdefghij][234567abcdefghijklmnopqrstuvwxyz]{12}$"
        revision:
          type: "integer"
          minimum: 0
        deleted:
          type: "boolean"
        attachments:
          type: "array"
          items:
            "$ref": "#/components/schemas/SocialDraftAssetBinding"
          maxItems: 800
      additionalProperties: false
    SocialDraftReserveInput:
      type: "object"
      required: ["assetId", "name", "contentType", "byteLength", "sha256", "kind"]
      properties:
        assetId:
          type: "string"
          minLength: 36
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        name:
          type: "string"
          minLength: 1
          maxLength: 1024
        contentType:
          type: "string"
          minLength: 1
          maxLength: 256
        byteLength:
          type: "integer"
          minimum: 1
          maximum: 104857600
        sha256:
          type: "string"
          minLength: 64
          maxLength: 64
        kind:
          type: "string"
          minLength: 1
          maxLength: 64
          enum: ["photo", "poster", "gif", "video", "caption"]
      additionalProperties: false
    SocialDraftPutManifestInput:
      type: "object"
      required: ["draftId", "expectedRevision", "attachments"]
      properties:
        draftId:
          type: "string"
          minLength: 13
          maxLength: 13
          pattern: "^[234567abcdefghij][234567abcdefghijklmnopqrstuvwxyz]{12}$"
        expectedRevision:
          type: "integer"
          minimum: 0
        attachments:
          type: "array"
          items:
            "$ref": "#/components/schemas/SocialDraftManifestRef"
          maxItems: 800
      additionalProperties: false
    SocialDraftDeleteManifestInput:
      type: "object"
      required: ["draftId", "expectedRevision"]
      properties:
        draftId:
          type: "string"
          minLength: 13
          maxLength: 13
          pattern: "^[234567abcdefghij][234567abcdefghijklmnopqrstuvwxyz]{12}$"
        expectedRevision:
          type: "integer"
          minimum: 0
      additionalProperties: false
    CreatorEngagement:
      type: [object, 'null']
      required: [likes, replies, reposts, quotes]
      properties:
        likes: {type: integer, minimum: 0}
        replies: {type: integer, minimum: 0}
        reposts: {type: integer, minimum: 0}
        quotes: {type: integer, minimum: 0}
    CreatorTracking:
      type: object
      required: [impressions, views, outboundClicks, ctr]
      properties:
        impressions: {type: integer, minimum: 0}
        views: {type: integer, minimum: 0}
        outboundClicks: {type: integer, minimum: 0}
        ctr: {type: [number, 'null'], minimum: 0, maximum: 100}
    CreatorAnalyticsItem:
      type: object
      required: [uri, kind, title, url, publishedAt, engagement, tracking, refreshedAt]
      properties:
        uri: {type: string}
        kind: {type: string, enum: [post, article]}
        title: {type: string}
        url: {type: string}
        publishedAt: {type: string}
        engagement: {$ref: '#/components/schemas/CreatorEngagement'}
        tracking: {$ref: '#/components/schemas/CreatorTracking'}
        refreshedAt: {type: string, format: date-time}
    BlueskyAnalyticsPost:
      type: object
      required: [uri, title, url, publishedAt, engagement]
      properties:
        uri: {type: string}
        title: {type: string}
        url: {type: string, format: uri}
        publishedAt: {type: string, format: date-time}
        engagement: {$ref: '#/components/schemas/CreatorEngagement'}
    BlueskyAnalyticsSummary:
      type: object
      required: [sampledAt, days, profile, activity, topPosts, shares, coverage]
      properties:
        sampledAt: {type: string, format: date-time}
        days: {type: integer, enum: [7, 30, 90]}
        profile:
          type: object
          required: [followers, following, posts]
          properties:
            followers: {type: [integer, 'null'], minimum: 0}
            following: {type: [integer, 'null'], minimum: 0}
            posts: {type: [integer, 'null'], minimum: 0}
        activity:
          type: [object, 'null']
          description: Observed authored posts and replies published during the selected period; excludes reposts. Null when the author feed is unavailable.
          required: [posts, replies, postsPerDay]
          properties:
            posts: {type: integer, minimum: 0}
            replies: {type: integer, minimum: 0}
            postsPerDay: {type: number, minimum: 0}
        topPosts:
          type: array
          maxItems: 10
          description: Observed authored posts published during the selected period, ranked by current cumulative likes plus replies plus reposts plus quotes. These counts are not interactions gained during the selected period.
          items: {$ref: '#/components/schemas/BlueskyAnalyticsPost'}
        shares:
          type: array
          description: Bounded AppView search results linking to cached viewer-owned article URLs. Search results and totals do not establish complete sharing coverage.
          maxItems: 5
          items:
            type: object
            required: [articleUri, articleTitle, articleUrl, posts]
            properties:
              articleUri: {type: string}
              articleTitle: {type: string}
              articleUrl: {type: string, format: uri}
              posts: {type: array, items: {$ref: '#/components/schemas/BlueskyAnalyticsPost'}}
        coverage:
          type: object
          required: [feedComplete, feedAvailable, sharesAvailable, sharesComplete, articlesSearched, feedPostsExamined]
          properties:
            feedComplete: {type: boolean, description: Whether the bounded feed scan exhausted available feed results.}
            feedAvailable: {type: boolean}
            sharesAvailable: {type: boolean}
            sharesComplete: {type: boolean, const: false}
            articlesSearched: {type: integer, minimum: 0, maximum: 5}
            feedPostsExamined: {type: integer, minimum: 0}
    PublicationAnalytics:
      type: object
      required: [uri, name, url, documents, subscribers, recommendations, recommendationCoverageComplete]
      properties:
        uri: {type: string, format: uri, description: Canonical site.standard.publication AT URI.}
        name: {type: string}
        url: {type: string, description: Public URL from the publication record.}
        documents: {type: integer, minimum: 0, description: Documents observed in the authenticated account's bounded public PDS inventory that reference this publication.}
        subscribers: {type: [integer, 'null'], minimum: 0, description: Distinct public subscriber accounts observed by the backlink index. Null if the count is unavailable.}
        recommendations: {type: [integer, 'null'], minimum: 0, description: Sum of distinct public recommender accounts per scanned document as observed by the backlink index. Null if the count is unavailable.}
        recommendationCoverageComplete: {type: boolean, description: Whether recommendation counts cover the full owned document inventory for this publication. The public backlink index determines which records can be observed.}
    PublicationAnalyticsSummary:
      type: object
      required: [sampledAt, publications, inventoryComplete]
      properties:
        sampledAt: {type: string, format: date-time}
        publications: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/PublicationAnalytics'}}
        inventoryComplete: {type: boolean, description: Whether the response covers the account's full public publication inventory and all associated owned documents.}
    CreatorAnalyticsSummary:
      type: object
      required: [items, totals, series, coverage]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CreatorAnalyticsItem'}}
        totals:
          type: object
          required: [engagement, tracking]
          properties:
            engagement: {$ref: '#/components/schemas/CreatorEngagement'}
            tracking: {$ref: '#/components/schemas/CreatorTracking'}
        series:
          type: array
          description: UTC daily cumulative platform snapshots alongside period Social Wire event counts. Null platform counts mean no snapshot that day.
          items:
            type: object
            required: [day, likes, replies, reposts, quotes, impressions, views, outboundClicks, ctr]
            properties:
              day: {type: string, format: date}
              likes: {type: [integer, 'null'], minimum: 0}
              replies: {type: [integer, 'null'], minimum: 0}
              reposts: {type: [integer, 'null'], minimum: 0}
              quotes: {type: [integer, 'null'], minimum: 0}
              impressions: {type: [integer, 'null'], minimum: 0}
              views: {type: [integer, 'null'], minimum: 0}
              outboundClicks: {type: [integer, 'null'], minimum: 0}
              ctr: {type: [number, 'null'], minimum: 0, maximum: 100}
        coverage:
          type: object
          required: [sampledAt, engagementKnownItems, totalItems, excludesSelf, trackingRetentionDays, snapshotStart, trackingStart, inventoryComplete, trackingScope, platformImpressions, snapshotSemantics]
          properties:
            sampledAt: {type: [string, 'null'], format: date-time}
            engagementKnownItems: {type: integer, minimum: 0}
            totalItems: {type: integer, minimum: 0}
            excludesSelf: {type: boolean}
            trackingRetentionDays: {type: integer}
            snapshotStart: {type: [string, 'null'], format: date}
            trackingStart: {type: [string, 'null'], format: date}
            inventoryComplete: {type: boolean}
            trackingScope: {type: string, enum: [social-wire]}
            platformImpressions: {type: 'null'}
            snapshotSemantics: {type: string}
        cursor: {type: string, description: Last canonical subject URI on this page; omitted at the end.}
    CreatorAnalyticsEvent:
      type: object
      additionalProperties: false
      required: [subjectUri, event, surface]
      properties:
        subjectUri: {type: string, description: Canonical AT-URI for a public Bluesky post or standard.site document; author is validated against its PDS.}
        event: {type: string, enum: [impression, view, outbound_click]}
        surface: {type: string, enum: [social-feed, article-feed, post-viewer, article-reader, messages]}
    StandardReaderListPublication:
      type: object
      required: [publicationId, title, authorDid]
      properties:
        publicationId: { type: string, description: Exact site.standard.publication AT URI from list membership }
        title: { type: string }
        authorDid: { type: string }
        authorHandle: { type: string }
        iconUrl: { type: string }
        avatarUrl: { type: string }
    StandardReaderList:
      type: object
      required: [uri, name, creatorDid, publications, users, owned, saved]
      properties:
        uri: { type: string }
        name: { type: string }
        description: { type: string }
        creatorDid: { type: string }
        publications: { type: array, items: { type: string } }
        users: { type: array, items: { type: string } }
        owned: { type: boolean }
        saved: { type: boolean }
        publicationDetails:
          type: array
          description: Cached server-resolved metadata for explicit publication members. Missing rows remain unresolved; membership and order come from publications. Refresh list metadata once the first feed page is ready.
          items: { $ref: '#/components/schemas/StandardReaderListPublication' }
    StandardReaderListsResponse:
      type: object
      required: [lists, refreshedAt, complete]
      properties:
        lists: { type: array, items: { $ref: '#/components/schemas/StandardReaderList' } }
        refreshedAt: { type: string }
        complete: { type: boolean }
        creatorDid: { type: string, description: Resolved creator DID on creator search responses even when no public lists exist }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code.
          example: Unauthorized
        message:
          type: string
          description: Human-readable error description.
          example: Unauthorized — invalid ATProto JWT or malformed DPoP proof.

    AppViewEnrollmentError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            articlesUpdated:
              type: boolean
              enum: [true]
              description: Present only after successful counter reconciliation when every failure is an upstream RSS fetch, parse, or backoff failure. HTTP 503 still indicates incomplete source checks; clients must refresh their article pages before presenting partial success. Omitted for request cancellation and infrastructure, PDS, or counter failures.
            unavailablePublicationIds:
              type: array
              uniqueItems: true
              description: Sorted canonical RSS publication IDs for failed feeds selected from this viewer's subscriptions. Only present with articlesUpdated; exact IDs distinguish multiple feeds on one host and may be used to match subscribed publication rows for unsubscribe actions. These viewer-private identifiers must never be logged. Older servers or unidentified failures may omit this field.
              items: { type: string }
            sourceFailures:
              type: array
              description: Sanitized upstream RSS diagnostics, included with articlesUpdated. Hostnames exclude credentials, paths, and query parameters; raw upstream messages are never returned.
              items:
                type: object
                required: [category, kind, count]
                properties:
                  category: { type: string, enum: [rss_backoff, rss_fetch, rss_parse] }
                  kind: { type: string, enum: [other, network, timeout] }
                  host: { type: string }
                  status: { type: integer, minimum: 100, maximum: 599 }
                  count: { type: integer, minimum: 1 }

    AppViewFeedError:
      type: object
      required: [error, message, requestId, retryable]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - feed_unavailable
            - feed_projection_warming
            - feed_dependency_unavailable
            - feed_deadline_exceeded
            - feed_internal_error
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean

    ArticleContentLabels:
      type: array
      description: Publisher-declared article self-labels for visual indicators only.
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        enum: [ai-generated, sexual]

    EntryListItem:
      type: object
      required: [entryId, title, publishedAt, isRead]
      properties:
        entryId:
          type: string
          description: at-uri identifying this entry.
          example: "at://did:plc:abc123/com.example.entry/3jxx"
        title:
          type: string
          example: "Hello, World"
        summary:
          type: string
          description: Short excerpt or subtitle.
        publishedAt:
          type: string
          format: date-time
        originalUrl:
          type: string
          format: uri
          description: |
            Canonical article HTTPS URL when known (RSS link, render `articleUrl`, etc.).
            Omitted for entries without a resolvable web permalink.
        publicationId:
          type: string
          description: Viewer-scoped canonical publication identity, present for aggregate feeds.
        contentLabels:
          $ref: '#/components/schemas/ArticleContentLabels'
        isRead:
          type: boolean
          default: false

    EntryDetail:
      type: object
      required: [entryId, title, publishedAt, isRead]
      properties:
