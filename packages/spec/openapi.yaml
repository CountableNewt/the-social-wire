            schema:
              type: object
              required: [upstreamDpopProof]
              properties:
                limit: { type: integer, minimum: 1, maximum: 100 }
                cursor: { type: string }
                upstreamDpopProof: { type: string }
      responses:
        "200": { description: Migration counts and optional continuation cursor. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /xrpc/app.thesocialwire.appview.getReadStateStatus:
    get:
      operationId: "getReadStateStatus"
      summary: "Read the authenticated viewer migration authority and verified manifest"
      description: "Read the authenticated viewer migration authority and verified manifest. No public or shared cache."
      tags: ["AppView"]
      responses:
        "200":
          description: "Verified read-state result"
          content:
            application/json:
              schema:
                type: "object"
                required: ["authority","migrationState","legacyRevision"]
                properties:
                  projectionReady:
                    type: boolean
                    default: true
                  authority:
                    type: "string"
                    maxLength: 7
                    enum: ["appview","pds"]
                  migrationState:
                    type: "string"
                    maxLength: 10
                    enum: ["notStarted","verified"]
                  legacyRevision:
                    type: "integer"
                    minimum: 0
                    maximum: 9007199254740991
                  manifest:
                    type: "object"
                    required: ["version","generation","lastSequence"]
                    properties:
                      version:
                        type: "integer"
                        const: 1
                      generation:
                        type: "string"
                        maxLength: 128
                      lastSequence:
                        type: "integer"
                        minimum: 0
                        maximum: 9007199254740991
                      head:
                        type: "object"
                        required: ["uri","cid"]
                        properties:
                          uri:
                            type: "string"
                            maxLength: 2048
                          cid:
                            type: "string"
                            maxLength: 2048
                  manifestCid:
                    type: "string"
                    maxLength: 256
        "400":
          description: "Invalid request"
        "401":
          description: "Authentication required"
        "409":
          description: "Revision changed, incomplete generation, or parity mismatch"
  /xrpc/app.thesocialwire.appview.exportReadState:
    post:
      operationId: "exportReadState"
      summary: "Export legacy read state in stable boundary, unread, read order"
      description: "Export legacy read state in stable boundary, unread, read order. Supply expectedLegacyRevision on every continuation; any concurrent legacy mutation invalidates the export. No source data is deleted."
      tags: ["AppView"]
      responses:
        "200":
          description: "Verified read-state result"
          content:
            application/json:
              schema:
                type: "object"
                required: ["legacyRevision","rows"]
                properties:
                  legacyRevision:
                    type: "integer"
                    minimum: 0
                    maximum: 9007199254740991
                  rows:
                    type: "array"
                    items:
                      type: "object"
                      required: ["kind","actedAt"]
                      properties:
                        kind:
                          type: "string"
                          maxLength: 8
                          enum: ["boundary","unread","read"]
                        actedAt:
                          type: "string"
                          maxLength: 2048
                          format: "date-time"
                        boundary:
                          type: "object"
                          required: ["scope","createdAt"]
                          properties:
                            scope:
                              type: "object"
                              required: ["publicationId","authorDid","publicationSiteKeys"]
                              properties:
                                publicationId:
                                  type: "string"
                                  maxLength: 2048
                                authorDid:
                                  type: "string"
                                  maxLength: 2048
                                publicationSiteKeys:
                                  type: "array"
                                  items:
                                    type: "string"
                                    maxLength: 2048
                                  maxItems: 128
                            createdAt:
                              type: "string"
                              maxLength: 2048
                              format: "date-time"
                            entryId:
                              type: "string"
                              maxLength: 2048
                        subjectUri:
                          type: "string"
                          maxLength: 2048
                    maxItems: 500
                  cursor:
                    type: "string"
                    maxLength: 4096
        "400":
          description: "Invalid request"
        "401":
          description: "Authentication required"
        "409":
          description: "Revision changed, incomplete generation, or parity mismatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: []
              properties:
                cursor:
                  type: "string"
                  maxLength: 4096
                expectedLegacyRevision:
                  type: "integer"
                  minimum: 0
                  maximum: 9007199254740991
                limit:
                  type: "integer"
                  minimum: 1
                  maximum: 500
  /xrpc/app.thesocialwire.appview.prepareReadState:
    post:
      operationId: "prepareReadState"
      summary: "Freeze a bulk-read selection without changing state"
      description: "Freeze a bulk-read selection without changing state. No cutoff returns publication boundaries; an age cutoff returns exact existing unread subject IDs plus calendar metadata. Clients split the selection into immutable PDS chunks. An excessive selection fails, never truncates."
      tags: ["AppView"]
      responses:
        "200":
          description: "Verified read-state result"
          content:
            application/json:
              schema:
                type: "object"
                required: ["actedAt","selection","legacyRevision"]
                properties:
                  previewSubjectUris:
                    type: array
                    maxItems: 1000
                    items:
                      type: string
                      maxLength: 2048
                  actedAt:
                    type: "string"
                    maxLength: 2048
                    format: "date-time"
                  selection:
                    type: "string"
                    maxLength: 10
                    enum: ["boundaries","exact"]
                  boundaries:
                    type: "array"
                    items:
                      type: "object"
                      required: ["scope","createdAt"]
                      properties:
                        scope:
                          type: "object"
                          required: ["publicationId","authorDid","publicationSiteKeys"]
                          properties:
                            publicationId:
                              type: "string"
                              maxLength: 2048
                            authorDid:
                              type: "string"
                              maxLength: 2048
                            publicationSiteKeys:
                              type: "array"
                              items:
                                type: "string"
                                maxLength: 2048
                              maxItems: 128
                        createdAt:
                          type: "string"
                          maxLength: 2048
                          format: "date-time"
                        entryId:
                          type: "string"
                          maxLength: 2048
                    maxItems: 100000
                  subjectUris:
                    type: "array"
                    items:
                      type: "string"
                      maxLength: 2048
                    maxItems: 100000
                  calendar:
                    type: "object"
                    required: ["cutoff","timeZone","referenceDate"]
                    properties:
                      cutoff:
                        type: "string"
                        format: "date-time"
                      timeZone:
                        type: "string"
                        maxLength: 128
                      referenceDate:
                        type: "string"
                        maxLength: 10
                    description: "Exact age selection audit metadata. Reference date is YYYY-MM-DD in the IANA timezone; cutoff is resolved UTC. Matching uses exact subject IDs, not recomputed calendar dates."
                  legacyRevision:
                    type: "integer"
                    minimum: 0
                    maximum: 9007199254740991
                  manifestCid:
                    type: "string"
                    maxLength: 256
        "400":
          description: "Invalid request"
        "401":
          description: "Authentication required"
        "409":
          description: "Revision changed, incomplete generation, or parity mismatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["scope"]
              properties:
                previewSubjectUris:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    maxLength: 2048
                scope:
                  type: "object"
                  required: ["kind"]
                  properties:
                    kind:
                      type: "string"
                      maxLength: 32
                    publicationId:
                      type: "string"
                      maxLength: 2048
                    folderRkey:
                      type: "string"
                      maxLength: 512
                before:
                  type: "string"
                  maxLength: 2048
                  format: "date-time"
                timeZone:
                  type: "string"
                  maxLength: 128
                referenceDate:
                  type: "string"
                  maxLength: 10

  /xrpc/app.thesocialwire.appview.confirmReadState:
    post:
      operationId: "confirmReadState"
      summary: "Fetch the viewer manifest and complete CID-pinned chain from their resolved PDS"
      description: "Fetch the viewer manifest and complete CID-pinned chain from their resolved PDS. Initial activation requires expectedLegacyRevision and structural parity with the complete legacy export. A manifest CID alone from a client is not proof. No source rows are deleted."
      tags: ["AppView"]
      responses:
        "200":
          description: "Verified read-state result"
          content:
            application/json:
              schema:
                type: "object"
                required: ["authority","migrationState","legacyRevision"]
                properties:
                  projectionReady:
                    type: boolean
                    default: true
                  authority:
                    type: "string"
                    maxLength: 7
                    enum: ["appview","pds"]
                  migrationState:
                    type: "string"
                    maxLength: 10
                    enum: ["notStarted","verified"]
                  legacyRevision:
                    type: "integer"
                    minimum: 0
                    maximum: 9007199254740991
                  manifest:
                    type: "object"
                    required: ["version","generation","lastSequence"]
                    properties:
                      version:
                        type: "integer"
                        const: 1
                      generation:
                        type: "string"
                        maxLength: 128
                      lastSequence:
                        type: "integer"
                        minimum: 0
                        maximum: 9007199254740991
                      head:
                        type: "object"
                        required: ["uri","cid"]
                        properties:
                          uri:
                            type: "string"
                            maxLength: 2048
                          cid:
                            type: "string"
                            maxLength: 2048
                  manifestCid:
                    type: "string"
                    maxLength: 256
        "400":
          description: "Invalid request"
        "401":
          description: "Authentication required"
        "409":
          description: "Revision changed, incomplete generation, or parity mismatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["manifestCid"]
              properties:
                manifestCid:
                  type: "string"
                  maxLength: 256
                expectedLegacyRevision:
                  type: "integer"
                  minimum: 0
                  maximum: 9007199254740991

