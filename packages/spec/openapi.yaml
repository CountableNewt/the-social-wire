        authorDid: { type: string }
        addedBy: { type: string }
        addedAt: { type: [string, "null"], format: date-time }
        viewerOwned: { type: boolean }

    SembleContributor:
      type: object
      additionalProperties: false
      required: [did]
      properties:
        did: { type: string }
        handle: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        avatar: { type: [string, "null"], format: uri }

    SembleNote:
      type: object
      additionalProperties: false
      required: [uri, text, authorDid, editable]
      properties:
        uri:
          type: [string, "null"]
          format: uri
          description: Null when the public projection cannot be linked to a proven PDS record.
        text: { type: string }
        authorDid: { type: string }
        editable: { type: boolean }

    SembleCollectionItem:
      type: object
      additionalProperties: false
      required: [id, cardUri, cardType, membership, unlinkAvailable, contributor]
      properties:
        id: { type: string }
        cardUri: { type: string, format: uri }
        cardCid: { type: [string, "null"] }
        cardType: { type: string, enum: [URL, NOTE] }
        url: { type: [string, "null"], format: uri }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }
        siteName: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: [string, "null"], format: date-time }
        membership:
          description: Exact collection-link record, or null when public PDS enrichment cannot prove it.
          anyOf:
            - { $ref: "#/components/schemas/SembleMembership" }
            - { type: "null" }
        unlinkAvailable:
          type: boolean
          description: True only when membership contains a proven strong-reference link record.
        contributor: { $ref: "#/components/schemas/SembleContributor" }
        note:
          anyOf:
            - { $ref: "#/components/schemas/SembleNote" }
            - { type: "null" }

    SembleCollectionPage:
      type: object
      additionalProperties: false
      required: [collection, items, membershipComplete, recordLinksComplete]
      properties:
        collection: { $ref: "#/components/schemas/SembleCollection" }
        items:
          type: array
          items: { $ref: "#/components/schemas/SembleCollectionItem" }
        cursor: { type: [string, "null"] }
        membershipComplete:
          type: boolean
          description: False when any projected item lacks a proven collection-link record.
        recordLinksComplete:
          type: boolean
          description: False when public PDS enrichment was incomplete; clients should expose retry.

    SembleConnection:
      type: object
      additionalProperties: false
      required: [uri, source, target, authorDid, editable]
      properties:
        uri:
          type: [string, "null"]
          format: uri
          description: Null when the projected connection cannot be linked to a proven PDS record.
        source: { type: string, format: uri }
        target: { type: string, format: uri }
        connectionType: { type: [string, "null"] }
        note: { type: [string, "null"] }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        authorDid: { type: string }
        editable: { type: boolean }

    SembleConnectionsPage:
      type: object
      additionalProperties: false
      required: [connections, recordLinksComplete]
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/SembleConnection" }
        cursor: { type: [string, "null"] }
        recordLinksComplete:
          type: boolean
          description: False when public PDS enrichment was incomplete; clients should expose retry.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must exactly match the request body's idempotencyKey value.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^\\S+$"

  responses:
    Unauthorized:
      description: Missing/invalid bearer token **or** DPoP mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated DID is not authorized for this environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested state transition is illegal or overlaps active work.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The bounded recovery or diagnostic rate limit has been reached.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The required capability or dependency is unavailable.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - ATProtoOAuthDPoP: []

