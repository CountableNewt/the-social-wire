      security:
        - MaintenanceCronBearer: []
      responses:
        '200':
          description: Due maintenance completed or competing workers own its leases.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: {$ref: '#/components/schemas/MaintenanceJobResult'}
        '401': {description: Dedicated scheduler secret is missing or invalid.}
        '405': {description: Unsupported method; HEAD never invokes maintenance.}
        '503': {description: Scheduler unavailable or bounded execution failed.}

