paths:
  /internal/jobs/scheduling:
    post:
      summary: Run Due Scheduling Work
      description: Bounded leased maintenance action shared by internal runners and authenticated HTTP triggers. A busy lease returns claimed=false. Serverless mode starts no background timers. Cron GET requires its separate secret and HEAD never executes work.
      security:
        - MaintenanceJobsBearer: []
      responses:
        '200':
          description: Job completed or another instance owns its lease.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceJobResult'}
        '401': {description: Dedicated bearer secret is missing or invalid.}
        '405': {description: Unsupported method; HEAD never invokes maintenance.}
        '503': {description: Job or secret unavailable, or bounded execution failed.}

