        publishedAt:
          type: string
          format: date-time
        thumbnailUrl:
          type: string
          format: uri
        contentLabels:
          $ref: '#/components/schemas/ArticleContentLabels'
        isRead:
          type: boolean
        contentHtml:
          type: string
          description: |
            Indexed HTML when available (notably RSS feed content), otherwise a
