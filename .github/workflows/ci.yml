name: CI

# Railway deploys protected branch merges from its GitHub integration. GitHub Actions
# verifies the pull request merge commit before it can reach dev or main.
on:
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24.19.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      operations_web: ${{ steps.filter.outputs.operations_web }}
      redis: ${{ steps.filter.outputs.redis }}
      shared_swift: ${{ steps.filter.outputs.shared_swift }}
      swift_backend: ${{ steps.filter.outputs.swift_backend }}
      podcast_worker: ${{ steps.filter.outputs.podcast_worker }}
      wire_corpus_edge: ${{ steps.filter.outputs.wire_corpus_edge }}
      database_migrator: ${{ steps.filter.outputs.database_migrator }}
      lexicons: ${{ steps.filter.outputs.lexicons }}
      spec: ${{ steps.filter.outputs.spec }}
      docs: ${{ steps.filter.outputs.docs }}
      benchmark_tools: ${{ steps.filter.outputs.benchmark_tools }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Record immutable PR verification context
        run: node scripts/ci/validated-merge.mjs --receipt
      - name: Test validated merge evidence
        run: node --test scripts/ci/validated-merge.test.mjs
      - name: Test bounded dependency installation
        run: node --test scripts/ci/install-bun.test.mjs
      - name: Test Development-first promotion guard
        run: node --test scripts/ci/development-parity.test.mjs
      - name: Require Production changes in Development first
        if: (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main')
        env:
          PRODUCTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PRODUCTION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch --no-tags origin dev
          git show refs/remotes/origin/dev:scripts/ci/development-parity.mjs > "${RUNNER_TEMP}/development-parity.mjs"
          node "${RUNNER_TEMP}/development-parity.mjs" --base "$PRODUCTION_BASE_SHA" --head "$PRODUCTION_HEAD_SHA" --development refs/remotes/origin/dev
      - name: Detect changed paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-detect-changes.sh

  web:
    name: Web
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-v2-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bash scripts/ci/install-bun.sh
      - name: Typecheck
        run: bunx turbo typecheck --filter=web
      - name: Lint
        run: bunx turbo lint --filter=web
      - name: Test shared PDS read-state protocol
        run: bun --cwd packages/read-state test
      - name: Typecheck shared PDS read-state protocol
        run: bun --cwd packages/read-state typecheck
      - name: Test
        # Let Bun finish both coverage reporters before writing to the runner's log pipe.
        run: |
          coverage_log="$(mktemp "${RUNNER_TEMP}/web-coverage.XXXXXX")"
          trap 'rm -f "$coverage_log"' EXIT
          set +e
          bun run --cwd apps/web test:coverage > "$coverage_log" 2>&1
          coverage_status=$?
          set -e
          cat "$coverage_log"
          exit "$coverage_status"
        env:
          NEXT_PUBLIC_APP_ENV: test

  operations-web:
    name: Operations Web
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.operations_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-v2-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bash scripts/ci/install-bun.sh
      - name: Typecheck
        run: bunx turbo typecheck --filter=operations
      - name: Lint
        run: bunx turbo lint --filter=operations
      - name: Test
        run: bun run --cwd apps/operations test:coverage

  redis:
    name: SocialWire Redis
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned Swift reference contracts
        run: python3 scripts/go/check-out-swift-contracts.py
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test Redis package and integration
        working-directory: packages/swift/SocialWireRedis
        run: swift test
        env:
          REDIS_INTEGRATION_URL: redis://127.0.0.1:6379

  swift-active-backend:
    name: Swift Backend (${{ matrix.service }})
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.swift_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            package: services/gateway
          - service: appview
            package: services/appview
          - service: indexing-worker
            package: services/indexing-worker
          - service: schema-ready
            package: tools/schema-ready
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tsw_backend_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d tsw_backend_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:8.2.8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_GATEWAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test?sslmode=disable
      TEST_SOCIAL_DRAFT_REDIS_URL: redis://127.0.0.1:6379
      REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
      ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test?sslmode=disable
      SOCIAL_DRAFT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test?sslmode=disable
      THIN_APPVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test?sslmode=disable
      PODCAST_PRIVATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test?sslmode=disable
      SCHEMA_READY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux Swift build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libxml2-dev libssl-dev pkg-config
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.2"
      - name: Apply canonical migrations for backend tests
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/tsw_backend_test
          postgres-container: ${{ job.services.postgres.id }}
      - uses: actions/cache@v5
        with:
          path: ${{ matrix.package }}/.build
          key: ${{ runner.os }}-swift-active-6.4.2-${{ matrix.service }}-${{ hashFiles('services/**/Package.resolved', 'tools/schema-ready/Package.resolved') }}
      - name: Test SQLite cutover and consistent backups
        if: matrix.service == 'appview'
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/migrations -p 'test_*.py'
      - name: Test active Swift backend
        working-directory: ${{ matrix.package }}
        run: swift test --force-resolved-versions -j 2
      - name: Test the shared AppView package used by the service
        if: matrix.service == 'appview'
        working-directory: services/appview
        run: swift test --package-path ../../packages/swift/thin-app-view-core --force-resolved-versions -j 2

      - name: Test the Redis package at the service's actual pin
        if: matrix.service == 'gateway'
        working-directory: services/gateway
        run: swift test --package-path .build/checkouts/social-wire-redis --force-resolved-versions -j 2

  shared-swift:
    name: Retained Swift Contracts
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.shared_swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_shared_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_shared_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned Swift reference contracts
        run: python3 scripts/go/check-out-swift-contracts.py
      - name: Apply database migrations for AppView integration tests
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test
          postgres-container: ${{ job.services.postgres.id }}
      - name: Cache retained Swift packages
        uses: actions/cache@v5
        with:
          path: |
            packages/swift/GatewayCore/.build
            packages/swift/ThinAppViewCore/.build
            packages/swift/ReadStateCore/.build
            packages/swift/OperationsCore/.build
            packages/swift/SocialWireRedis/.build
            packages/swift/WireCore/.build
            packages/swift/FinanceCore/.build
            packages/swift/SportsCore/.build
          key: ${{ runner.os }}-swift-shared-6.2.4-${{ hashFiles('packages/swift/**/Package.resolved', 'packages/go/migration/extracted-swift-packages.json') }}
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test portable read-state protocol
        working-directory: packages/swift/ReadStateCore
        run: swift test
      - name: Test retained AppView shared contracts
        working-directory: packages/swift/ThinAppViewCore
        env:
          THIN_APPVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test?sslmode=disable
          PODCAST_PRIVATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test?sslmode=disable
        run: swift test --skip PostgresFeedQueryDeadlineTests
      - name: Test AppView PostgreSQL deadlines without unrelated test load
        working-directory: packages/swift/ThinAppViewCore
        env:
          THIN_APPVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test?sslmode=disable
          PODCAST_PRIVATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test?sslmode=disable
        # Keep the real query deadline assertion independent of unrelated test scheduling.
        run: swift test --skip-build --no-parallel --filter PostgresFeedQueryDeadlineTests
      - name: Test retained Wire and topic domains
        run: |
          (cd packages/swift/WireCore && swift test)
          (cd packages/swift/FinanceCore && swift test)
          (cd packages/swift/SportsCore && swift test)
      - name: Test retained Gateway authentication contracts
        working-directory: packages/swift/GatewayCore
        run: swift test
      - name: Test OperationsCore
        working-directory: packages/swift/OperationsCore
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test?sslmode=disable
        run: swift test --skip 'PostgresRoleLeaseAuthorityTests|PostgresRoleLeaseDiagnosticIntegrationTests|PostgresRoleLeaseDiagnosticTransportTests|PostgresIngestionCensusBudgetTests'
      - name: Test lease deadlines without unrelated test load
        working-directory: packages/swift/OperationsCore
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_shared_test?sslmode=disable
        # Integration tests still exercise their own concurrent transactions.
        run: swift test --skip-build --no-parallel --filter 'PostgresRoleLeaseAuthorityTests|PostgresRoleLeaseDiagnosticIntegrationTests|PostgresRoleLeaseDiagnosticTransportTests|PostgresIngestionCensusBudgetTests'

  # Real PostgreSQL transactions and actual Swift oracles verify the local Go
  # foundation; this job participates in the required aggregate branch gate.
  wire-corpus-edge:
    name: The Wire Corpus Edge
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.wire_corpus_edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_wire_corpus_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_wire_corpus_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply database migrations
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test
      - name: Verify presentation-only read contract
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test \
            -X -v ON_ERROR_STOP=1 -f scripts/verify-wire-corpus-serving.sql
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify Corpus serving boundary rejects unreviewed payloads and scores
        env:
          CORPUS_SERVING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_release_corpus_boundary
          PSQL_BIN: psql
        run: |
          "$PSQL_BIN" postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tsw_release_corpus_boundary TEMPLATE socialwire_wire_corpus_test'
          bun test packages/spec/__tests__/wire-corpus-serving-verifier-postgres.test.ts

  database-migrator:
    name: Database Migrator
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.database_migrator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_migrations
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_migrations"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify PostgreSQL clean shutdown
        run: services/postgres/tests/shutdown.sh
      - name: Check migration runner syntax
        run: |
          bash -n scripts/apply-database-migrations.sh
          bash -n scripts/verify-postgres-restore.sh
      - name: Apply migrations from empty and verify idempotence
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations
          verify-idempotence: "true"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify telemetry and retention migration guards, interrupted retry, and bounded inbox diagnostics
        env:
          POSTGRES_MIGRATION_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw92_telemetry_test
          PSQL_BIN: psql
        run: |
          "$PSQL_BIN" postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tsw92_telemetry_test'
          bun test --timeout 30000 packages/spec/__tests__/telemetry-index-migration-postgres.test.ts packages/spec/__tests__/operations-retention-migration-postgres.test.ts packages/spec/__tests__/operations-change-retention-postgres.test.ts packages/spec/__tests__/wire-inbox-readiness-postgres.test.ts packages/spec/__tests__/wire-ordered-signal-migration-postgres.test.ts packages/spec/__tests__/wire-working-set-indexes-postgres.test.ts
      - name: Verify Jetstream V2 drain indexes and query plans
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations \
            -X -v ON_ERROR_STOP=1 -f scripts/verify-jetstream-v2-drain-indexes.sql
      - name: Verify The Wire inbox claim index and query plan
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations \
            -X -v ON_ERROR_STOP=1 -f scripts/verify-wire-inbox-claim-index.sql

  lexicons:
    name: Lexicons
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.lexicons == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-v2-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bash scripts/ci/install-bun.sh
      - name: Test
        working-directory: packages/lexicons
        run: bun test

  spec:
    name: OpenAPI Spec
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned Swift reference contracts
        run: python3 scripts/go/check-out-swift-contracts.py
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-v2-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bash scripts/ci/install-bun.sh
      - name: Test
        working-directory: packages/spec
        run: bun test

  benchmark-tools:
    name: Benchmark Tools
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.benchmark_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client for isolated SQL tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Build isolated PostgreSQL restart fixture
        run: docker build --file scripts/benchmarks/fixtures/postgres-restart/Dockerfile --tag tsw114-postgres-process-restart:test .
      - name: Test benchmark safety and evidence tools
        env:
          TSW_RECEIPT_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          RANKING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          TSW_RESTART_TEST_IMAGE: tsw114-postgres-process-restart:test
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts/benchmarks/tests

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check wiki links and navigation
        run: bash scripts/check-wiki-links.sh

  podcast-worker:
    name: Podcast Media Worker
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.podcast_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: podcast-validation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PODCAST_TEST_DATABASE_URL: postgres://postgres:podcast-validation-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-v2-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bash scripts/ci/install-bun.sh
      - name: Typecheck
        run: bun --cwd services/podcast-worker typecheck
      - name: Test media processing and bridge identities
        run: bun --cwd services/podcast-worker test

  required:
    name: CI — Required
    needs:
      - changes
      - web
      - operations-web
      - redis
      - shared-swift
      - swift-active-backend
      - podcast-worker
      - wire-corpus-edge
      - database-migrator
      - lexicons
      - spec
      - docs
      - benchmark-tools
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify path-filtered checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_FLAG: ${{ needs.changes.outputs.web }}
          OPERATIONS_WEB_FLAG: ${{ needs.changes.outputs.operations_web }}
          REDIS_FLAG: ${{ needs.changes.outputs.redis }}
          SHARED_SWIFT_FLAG: ${{ needs.changes.outputs.shared_swift }}
          SWIFT_BACKEND_FLAG: ${{ needs.changes.outputs.swift_backend }}
          PODCAST_WORKER_FLAG: ${{ needs.changes.outputs.podcast_worker }}
          WIRE_CORPUS_EDGE_FLAG: ${{ needs.changes.outputs.wire_corpus_edge }}
          DATABASE_MIGRATOR_FLAG: ${{ needs.changes.outputs.database_migrator }}
          LEXICONS_FLAG: ${{ needs.changes.outputs.lexicons }}
          SPEC_FLAG: ${{ needs.changes.outputs.spec }}
          DOCS_FLAG: ${{ needs.changes.outputs.docs }}
          BENCHMARK_TOOLS_FLAG: ${{ needs.changes.outputs.benchmark_tools }}
          WEB_RESULT: ${{ needs.web.result }}
          OPERATIONS_WEB_RESULT: ${{ needs.operations-web.result }}
          REDIS_RESULT: ${{ needs.redis.result }}
          SHARED_SWIFT_RESULT: ${{ needs.shared-swift.result }}
          SWIFT_BACKEND_RESULT: ${{ needs.swift-active-backend.result }}
          PODCAST_WORKER_RESULT: ${{ needs.podcast-worker.result }}
          WIRE_CORPUS_EDGE_RESULT: ${{ needs.wire-corpus-edge.result }}
          DATABASE_MIGRATOR_RESULT: ${{ needs.database-migrator.result }}
          LEXICONS_RESULT: ${{ needs.lexicons.result }}
          SPEC_RESULT: ${{ needs.spec.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BENCHMARK_TOOLS_RESULT: ${{ needs.benchmark-tools.result }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            fail "Path detection failed ($CHANGES_RESULT)"
          fi

          check() {
            local flag="$1"
            local result="$2"
            local name="$3"

            if [[ "$flag" == "true" && "$result" != "success" ]]; then
              fail "$name must pass when its paths change (got $result)"
            fi
            if [[ "$flag" != "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              fail "$name ended with $result"
            fi
          }

          check "$WEB_FLAG" "$WEB_RESULT" "Web"
          check "$OPERATIONS_WEB_FLAG" "$OPERATIONS_WEB_RESULT" "Operations Web"
          check "$REDIS_FLAG" "$REDIS_RESULT" "SocialWire Redis"
          check "$SHARED_SWIFT_FLAG" "$SHARED_SWIFT_RESULT" "Retained Swift Contracts"
          check "$SWIFT_BACKEND_FLAG" "$SWIFT_BACKEND_RESULT" "Active Swift Backends"
          check "$PODCAST_WORKER_FLAG" "$PODCAST_WORKER_RESULT" "Podcast Media Worker"
          check "$WIRE_CORPUS_EDGE_FLAG" "$WIRE_CORPUS_EDGE_RESULT" "The Wire Corpus Edge"
          check "$DATABASE_MIGRATOR_FLAG" "$DATABASE_MIGRATOR_RESULT" "Database Migrator"
          check "$LEXICONS_FLAG" "$LEXICONS_RESULT" "Lexicons"
          check "$SPEC_FLAG" "$SPEC_RESULT" "OpenAPI Spec"
          check "$DOCS_FLAG" "$DOCS_RESULT" "Documentation"
          check "$BENCHMARK_TOOLS_FLAG" "$BENCHMARK_TOOLS_RESULT" "Benchmark Tools"
