name: CI

# GitHub remains the protected source gate during the Railway standalone cutover.
# Verify the packaged Web and SQLite backend processes before Railway source builds.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24.19.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      appview: ${{ steps.filter.outputs.appview }}
      reuse_web: ${{ steps.reuse.outputs.reuse_web }}
      reuse_appview: ${{ steps.reuse.outputs.reuse_appview }}
      cache_run_id: ${{ steps.reuse.outputs.cache_run_id }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Record immutable PR verification context
        run: node scripts/ci/validated-merge.mjs --receipt
      - name: Test validated merge evidence
        run: node --test scripts/ci/validated-merge.test.mjs
      - name: Test PR verification reuse and required gate
        run: node --test scripts/ci/reuse-pr-verification.test.mjs scripts/ci/required-checks.test.mjs scripts/ci/reuse-workflow.test.mjs
      - name: Test bounded dependency installation
        run: node --test scripts/ci/install-bun.test.mjs
      - name: Test Development-first promotion guard
        run: node --test scripts/ci/development-parity.test.mjs
      - name: Require Production changes in Development first
        if: (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PRODUCTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PRODUCTION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          git fetch --no-tags origin dev
          git show refs/remotes/origin/dev:scripts/ci/development-parity.mjs > "${RUNNER_TEMP}/development-parity.mjs"
          node "${RUNNER_TEMP}/development-parity.mjs" --base "$PRODUCTION_BASE_SHA" --head "$PRODUCTION_HEAD_SHA" --development refs/remotes/origin/dev
      - name: Detect changed paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-detect-changes.sh
      - name: Reuse exact successful PR verification
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_WEB: ${{ steps.filter.outputs.web }}
          INPUT_APPVIEW: ${{ steps.filter.outputs.appview }}
        run: node scripts/ci/reuse-pr-verification.mjs

  web:
    name: Web
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true' && needs.changes.outputs.reuse_web != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Restore Docker build layers
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-${{ hashFiles('apps/web/Dockerfile', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-${{ hashFiles('apps/web/Dockerfile', 'bun.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-
      - name: Verify Web image, coverage, and shared contracts
        run: bash scripts/ci/verify-runtime-images.sh web
        env:
          CI_DOCKER_CACHE_DIR: ${{ runner.temp }}/docker-cache

      # PR caches live under refs/pull/*/merge. Carry the verified cache to the
      # eventual base-branch push instead of compiling the same tree again.
      - name: Publish verified web build layers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docker-cache-web
          path: ${{ runner.temp }}/docker-cache
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  appview_lanes:
    name: AppView (${{ matrix.lane }})
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.appview == 'true' && needs.changes.outputs.reuse_appview != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [tests, release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Restore SwiftPM state
        id: swiftpm
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/appview-swiftpm
          key: appview-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('services/appview/Dockerfile.standalone', '**/Package.swift', '**/Package.resolved', 'scripts/ci/appview-test-targets.swift', 'scripts/ci/prepare-swift-tests.py', 'scripts/ci/benchmark-appview-swiftpm.sh') }}-${{ github.sha }}
          restore-keys: |
            appview-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('services/appview/Dockerfile.standalone', '**/Package.swift', '**/Package.resolved', 'scripts/ci/appview-test-targets.swift', 'scripts/ci/prepare-swift-tests.py', 'scripts/ci/benchmark-appview-swiftpm.sh') }}-
      - name: Verify AppView lane
        env:
          LANE: ${{ matrix.lane }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/ci/benchmark-appview-swiftpm.sh "$LANE" initial
      - name: Save verified SwiftPM state
        if: steps.swiftpm.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/appview-swiftpm
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}
      # Archive before uploading to preserve SwiftPM symlinks and permissions.
      - name: Archive verified SwiftPM state
        id: archive
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: tar -C "$RUNNER_TEMP/appview-swiftpm" -I 'zstd -T0' -cf "$RUNNER_TEMP/appview-swiftpm.tar.zst" .
      - name: Publish verified SwiftPM state
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: appview-swiftpm-${{ matrix.lane }}
          path: ${{ runner.temp }}/appview-swiftpm.tar.zst
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  appview:
    # Preserve the check name used by exact-tree post-merge verification.
    name: SQLite AppView
    needs: [changes, appview_lanes]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.appview == 'true' && needs.changes.outputs.reuse_appview != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require both AppView lanes
        env:
          LANES_RESULT: ${{ needs.appview_lanes.result }}
        run: test "$LANES_RESULT" = success

  warm_base_cache:
    name: Warm Web Cache
    needs: changes
    if: github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.cache_run_id != '' && needs.changes.outputs.reuse_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download exact verified PR build layers
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docker-cache-web
          path: ${{ runner.temp }}/docker-cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.changes.outputs.cache_run_id }}
      - name: Save verified layers in base-branch cache scope
        if: steps.download.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-${{ hashFiles('apps/web/Dockerfile', 'bun.lock') }}-${{ github.sha }}

  warm_appview_cache:
    name: Warm AppView Cache (${{ matrix.lane }})
    needs: changes
    if: github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.cache_run_id != '' && needs.changes.outputs.reuse_appview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        lane: [tests, release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download verified SwiftPM state
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: appview-swiftpm-${{ matrix.lane }}
          path: ${{ runner.temp }}/appview-cache-archive
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.changes.outputs.cache_run_id }}
      - name: Unpack verified SwiftPM state
        id: unpack
        if: steps.download.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/appview-swiftpm"
          tar --no-same-owner --no-same-permissions -C "$RUNNER_TEMP/appview-swiftpm" -I zstd -xf "$RUNNER_TEMP/appview-cache-archive/appview-swiftpm.tar.zst"
      - name: Save SwiftPM state in base-branch cache scope
        if: steps.unpack.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/appview-swiftpm
          key: appview-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('services/appview/Dockerfile.standalone', '**/Package.swift', '**/Package.resolved', 'scripts/ci/appview-test-targets.swift', 'scripts/ci/prepare-swift-tests.py', 'scripts/ci/benchmark-appview-swiftpm.sh') }}-${{ github.sha }}

  required:
    name: CI — Required
    needs: [changes, web, appview]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify path-filtered checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_FLAG: ${{ needs.changes.outputs.web }}
          APPVIEW_FLAG: ${{ needs.changes.outputs.appview }}
          WEB_RESULT: ${{ needs.web.result }}
          APPVIEW_RESULT: ${{ needs.appview.result }}
          REUSE_WEB: ${{ needs.changes.outputs.reuse_web }}
          REUSE_APPVIEW: ${{ needs.changes.outputs.reuse_appview }}
        run: node scripts/ci/required-checks.mjs
