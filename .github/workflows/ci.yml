name: CI

# GitHub remains the protected source gate during the Railway standalone cutover.
# Verify the packaged Web and Go SQLite backend processes before Railway source builds.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24.19.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      appview: ${{ steps.filter.outputs.appview }}
      apple: ${{ steps.filter.outputs.apple }}
      reuse_web: ${{ steps.reuse.outputs.reuse_web }}
      reuse_appview: ${{ steps.reuse.outputs.reuse_appview }}
      cache_run_id: ${{ steps.reuse.outputs.cache_run_id }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Record immutable PR verification context
        run: node scripts/ci/validated-merge.mjs --receipt
      - name: Test validated merge evidence
        run: node --test scripts/ci/validated-merge.test.mjs
      - name: Test PR verification reuse and required gate
        run: node --test scripts/ci/reuse-pr-verification.test.mjs scripts/ci/required-checks.test.mjs scripts/ci/reuse-workflow.test.mjs
      - name: Test bounded dependency installation
        run: node --test scripts/ci/install-bun.test.mjs
      - name: Test Development-first promotion guard
        run: node --test scripts/ci/development-parity.test.mjs
      - name: Require Production changes in Development first
        if: (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PRODUCTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PRODUCTION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          git fetch --no-tags origin dev
          git show refs/remotes/origin/dev:scripts/ci/development-parity.mjs > "${RUNNER_TEMP}/development-parity.mjs"
          node "${RUNNER_TEMP}/development-parity.mjs" --base "$PRODUCTION_BASE_SHA" --head "$PRODUCTION_HEAD_SHA" --development refs/remotes/origin/dev
      - name: Detect changed paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-detect-changes.sh
      - name: Reuse exact successful PR verification
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_WEB: ${{ steps.filter.outputs.web }}
          INPUT_APPVIEW: ${{ steps.filter.outputs.appview }}
        run: node scripts/ci/reuse-pr-verification.mjs

  web:
    name: Web
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true' && needs.changes.outputs.reuse_web != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Restore Docker build layers
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-${{ hashFiles('apps/web/Dockerfile', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-${{ hashFiles('apps/web/Dockerfile', 'bun.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-
      - name: Verify Web image, coverage, and shared contracts
        run: bash scripts/ci/verify-runtime-images.sh web
        env:
          CI_DOCKER_CACHE_DIR: ${{ runner.temp }}/docker-cache

      # PR caches live under refs/pull/*/merge. Carry the verified cache to the
      # eventual base-branch push instead of compiling the same tree again.
      - name: Publish verified web build layers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docker-cache-web
          path: ${{ runner.temp }}/docker-cache
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  appview_go:
    name: AppView (Go)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.appview == 'true' && needs.changes.outputs.reuse_appview != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/appview
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/appview/go.mod
          cache: false
      # Key on the commit so the build cache stays current; restore the newest
      # cache for the same module graph, then any earlier one.
      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: appview-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('services/appview/go.sum') }}-${{ github.sha }}
          restore-keys: |
            appview-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('services/appview/go.sum') }}-
            appview-go-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify AppView sources
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "gofmt required:"; echo "$unformatted"; exit 1; fi
          go test -vet=all -count=1 ./...
      - name: Save Go build cache
        if: steps.gocache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
      # Archive before uploading to preserve module cache permissions.
      - name: Archive verified Go build cache
        id: archive
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: .
        run: tar -C "$HOME" -I 'zstd -T0' -cf "$RUNNER_TEMP/appview-go.tar.zst" .cache/go-build go/pkg/mod
      - name: Publish verified Go build cache
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: appview-go
          path: ${{ runner.temp }}/appview-go.tar.zst
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  appview_image:
    name: AppView (Image)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.appview == 'true' && needs.changes.outputs.reuse_appview != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - name: Restore Docker build layers
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-appview-v2-${{ hashFiles('services/appview/Dockerfile.standalone', 'services/appview/go.sum', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-docker-appview-v2-${{ hashFiles('services/appview/Dockerfile.standalone', 'services/appview/go.sum', 'bun.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-docker-appview-v2-
      - name: Verify AppView image and packaged runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/ci/verify-runtime-images.sh appview
        env:
          CI_DOCKER_CACHE_DIR: ${{ runner.temp }}/docker-cache
      - name: Publish verified AppView build layers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docker-cache-appview
          path: ${{ runner.temp }}/docker-cache
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  appview:
    # Preserve the check name used by exact-tree post-merge verification.
    name: SQLite AppView
    needs: [changes, appview_go, appview_image]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.appview == 'true' && needs.changes.outputs.reuse_appview != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require Go and image verification
        env:
          GO_RESULT: ${{ needs.appview_go.result }}
          IMAGE_RESULT: ${{ needs.appview_image.result }}
        run: test "$GO_RESULT" = success && test "$IMAGE_RESULT" = success

  apple:
    name: Apple
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify native app and ReadStateCore
        run: bash scripts/ci/apple-test.sh
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-results
          path: ${{ runner.temp }}/social-wire-apple-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  warm_base_cache:
    name: Warm Web Cache
    needs: changes
    if: github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.cache_run_id != '' && needs.changes.outputs.reuse_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download exact verified PR build layers
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docker-cache-web
          path: ${{ runner.temp }}/docker-cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.changes.outputs.cache_run_id }}
      - name: Save verified layers in base-branch cache scope
        if: steps.download.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-web-v1-${{ hashFiles('apps/web/Dockerfile', 'bun.lock') }}-${{ github.sha }}

  warm_appview_cache:
    name: Warm AppView Cache
    needs: changes
    if: github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.cache_run_id != '' && needs.changes.outputs.reuse_appview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download verified Go build cache
        id: download_go
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: appview-go
          path: ${{ runner.temp }}/appview-go-archive
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.changes.outputs.cache_run_id }}
      - name: Unpack verified Go build cache
        id: unpack_go
        if: steps.download_go.outcome == 'success'
        run: tar --no-same-owner -C "$HOME" -I zstd -xf "$RUNNER_TEMP/appview-go-archive/appview-go.tar.zst"
      - name: Save Go build cache in base-branch cache scope
        if: steps.unpack_go.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: appview-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('services/appview/go.sum') }}-${{ github.sha }}
      - name: Download exact verified AppView build layers
        id: download_layers
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docker-cache-appview
          path: ${{ runner.temp }}/docker-cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.changes.outputs.cache_run_id }}
      - name: Save verified layers in base-branch cache scope
        if: steps.download_layers.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-docker-appview-v2-${{ hashFiles('services/appview/Dockerfile.standalone', 'services/appview/go.sum', 'bun.lock') }}-${{ github.sha }}

  required:
    name: CI — Required
    needs: [changes, web, appview, apple]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify path-filtered checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_FLAG: ${{ needs.changes.outputs.web }}
          APPVIEW_FLAG: ${{ needs.changes.outputs.appview }}
          APPLE_FLAG: ${{ needs.changes.outputs.apple }}
          WEB_RESULT: ${{ needs.web.result }}
          APPVIEW_RESULT: ${{ needs.appview.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          REUSE_WEB: ${{ needs.changes.outputs.reuse_web }}
          REUSE_APPVIEW: ${{ needs.changes.outputs.reuse_appview }}
        run: node scripts/ci/required-checks.mjs
