name: AppView SwiftPM Benchmark

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/appview-swiftpm-benchmark.yml
      - scripts/ci/benchmark-appview-swiftpm.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appview-swiftpm-benchmark-${{ github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: SwiftPM benchmark (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [tests, release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - uses: docker/setup-buildx-action@v3
      - name: Restore SwiftPM state
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/appview-swiftpm
          key: appview-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('services/appview/Dockerfile.standalone', '**/Package.swift', '**/Package.resolved', 'scripts/ci/appview-test-targets.swift', 'scripts/ci/prepare-swift-tests.py', 'scripts/ci/benchmark-appview-swiftpm.sh') }}-${{ github.sha }}
          restore-keys: |
            appview-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ hashFiles('services/appview/Dockerfile.standalone', '**/Package.swift', '**/Package.resolved', 'scripts/ci/appview-test-targets.swift', 'scripts/ci/prepare-swift-tests.py', 'scripts/ci/benchmark-appview-swiftpm.sh') }}-
      - name: Verify the checked-out revision
        env:
          LANE: ${{ matrix.lane }}
          RESTORED_CACHE: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SwiftPM cache: %s\n' "${RESTORED_CACHE:-miss}" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci/benchmark-appview-swiftpm.sh "$LANE" initial
      - name: Save verified SwiftPM state
        if: steps.cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/appview-swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Benchmark a warm Swift edit
        env:
          LANE: ${{ matrix.lane }}
        run: bash scripts/ci/benchmark-appview-swiftpm.sh "$LANE" edit
