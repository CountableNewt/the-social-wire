when:
  - event: pull_request
    branch: [dev, main]
  - event: push
    branch: ["feature/**", "fix/**", "refactor/**", "chore/**", "test/**", "codex/**"]

engine: microvm
image: nixos
clone:
  depth: 1

dependencies:
  - nodejs_24
  - git
  - python3

virtualisation:
  docker: true

steps:
  - name: Verify Linux Web and SQLite Backend
    command: bash scripts/ci/spindle-verify.sh
    environment:
      ATCR_DEVICE_SECRET: ""
      RAILWAY_TOKEN: ""
      RAILWAY_API_TOKEN: ""
